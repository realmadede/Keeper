name: Build Android APK

on:
  push:
    branches:
      - Android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed Release APK (or Debug fallback if keystore secret not set)
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEEPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEEPER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEEPER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEEPER_VERSION_CODE: ${{ 100 + github.run_number }}
          KEEPER_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            export KEEPER_KEYSTORE_PATH="$PWD/release-keystore.jks"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Keeper.apk
            rm -f release-keystore.jks
            echo "BUILD_TYPE=Signed Release (v1.0.${{ github.run_number }})" >> $GITHUB_ENV
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Keeper.apk
            echo "BUILD_TYPE=Debug (add ANDROID_KEYSTORE_BASE64 secret to sign release APKs)" >> $GITHUB_ENV
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Android-APK
          path: Keeper.apk

      - name: Publish latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Keeper Android App (v1.0.${{ github.run_number }})
          body: |
            Latest Keeper Android APK built from the `Android` branch.
            Build type: ${{ env.BUILD_TYPE }}
          make_latest: true
          files: Keeper.apk
