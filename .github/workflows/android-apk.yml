name: Build Android APK

on:
  push:
    branches:
      - Android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Keeper.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Keeper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Android-APK
          path: Keeper.apk

      - name: Publish latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Keeper Android App
          body: Latest Keeper Android APK built from the `Android` branch.
          make_latest: true
          files: Keeper.apk
