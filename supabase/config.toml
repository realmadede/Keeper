# Supabase project configuration for automatic CLI & GitHub migration detection
project_id = "keeper"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
enable_signup = true
minimum_password_length = 6

[realtime]
enabled = true
